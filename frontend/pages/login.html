<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Weekly Winner</title>
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="login-container">
    <h1>Welcome to Weekly Winner!</h1>
    <p>Log in to participate in the websites activities </p>

    <button id="google-login-btn">Sign in with Google</button>
    <p id="login-error" role="alert"></p>

  </main>

  <script type="module">
    import { login } from "/js/auth.js";
    document.getElementById("google-login-btn").addEventListener("click", login);
  </script>
</body>
</html>
